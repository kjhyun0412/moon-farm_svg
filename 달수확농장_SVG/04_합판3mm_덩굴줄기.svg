<g id="LABEL_참고용" inkscape:groupmode="layer" inkscape:label="LABEL_참고용(가공 제외)" fill="#888888" stroke="none" font-family="sans-serif" font-size="3"><text x="6" y="9.4" font-size="2.6">VA ×1 · 100.4×235.7</text><text x="6" y="12.4" font-size="2.4">덩굴 줄기 A (z=40)</text><text x="7" y="18" font-size="2">잎 41 · 꽃 12 · 별 6 (자리표시)</text><text x="112.4" y="9.4" font-size="2.6">VB ×1 · 95.4×233.2</text><text x="112.4" y="12.4" font-size="2.4">덩굴 줄기 B (z=13)</text><text x="113.4" y="18" font-size="2">잎 32 · 꽃 5 · 별 9 (자리표시)</text><text x="213.8" y="9.4" font-size="2.6">VC ×1 · 3.4×218</text><text x="213.8" y="12.4" font-size="2.4">덩굴 줄기 C (z=-18)</text><text x="214.8" y="18" font-size="2">잎 18 · 꽃 0 · 별 9 (자리표시)</text><text x="6" y="260.3">VA: 앞(z=40) · VB: 가운데(z=13) · VC: 뒤(z=-18). VA·VB는 왼쪽 줄기가 아치 윗부분까지 이어져 오른쪽 스프링라인(y=189.5)에서 끝남</text><text x="6" y="264.9">.</text><text x="6" y="269.5">잎·꽃·별은 11번 종이 장식 시트. 3D에서 줄기는 공중에 떠 있어 줄기 폭 1.7 → 3.4, 줄기 x를 호 끝에 맞춤(VA -51→-48.5, VB -54→-46</text><text x="6" y="274.1">, 3D도 같은 값으로 수정). VB는 y>189.5 위의 잎 3·별 1은 아치 호와 겹쳐 생략(3D 대비).</text></g>
</svg>
