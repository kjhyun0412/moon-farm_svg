 x="365.448" y="42.08" font-size="2.6">PT1b ×1 · 9.2×8.2</text><text x="365.448" y="45.08" font-size="2.4">화분 1 가운데층(새싹 홈)</text><text x="409.408" y="42.08" font-size="2.6">PT2a ×2 (1/2) · 7.82×6.97</text><text x="409.408" y="45.08" font-size="2.4">화분 2 앞·뒤층</text><text x="456.384" y="42.08" font-size="2.6">PT2a ×2 (2/2) · 7.82×6.97</text><text x="456.384" y="45.08" font-size="2.4">화분 2 앞·뒤층</text><text x="503.36" y="42.08" font-size="2.6">PT2b ×1 · 7.82×6.97</text><text x="503.36" y="45.08" font-size="2.4">화분 2 가운데층(새싹 홈)</text><text x="6" y="70.28">바구니 5층(밑→위 BK1~BK5) 접착 = 높이 15. 맨 윗층 BK5의 파랑 원 22개 = 꽃(종이 Ø6.8) 자리, 숫자 = 순서(11번 시트 색 지정).</text><text x="6" y="74.88">물뿌리개 4장 겹침(12mm). 화분 = 앞·뒤층(a) 사이에 가운데층(b, 새싹 홈) 끼움 = 9mm(스케일 0.85 화분은 약간 두꺼움).</text><text x="6" y="79.48">랜턴: 앞(LF)+가운데(LM)+뒤(LB 유백 아크릴) = 9mm. 지붕은 검정 도색. 선반 받침 6개는 선반 아래 접착(좌 x=-46, 우 x=-24).</text></g>
</svg>
