/text><text x="86.552" y="136.9" font-size="2.4">사다리 발판 덧댐(앞면에 접착)</text><text x="128.312" y="133.9" font-size="2.6">LD2 ×9 (2/9) · 24×2.6</text><text x="128.312" y="136.9" font-size="2.4">사다리 발판 덧댐(앞면에 접착)</text><text x="170.072" y="133.9" font-size="2.6">LD2 ×9 (3/9) · 24×2.6</text><text x="170.072" y="136.9" font-size="2.4">사다리 발판 덧댐(앞면에 접착)</text><text x="211.832" y="133.9" font-size="2.6">LD2 ×9 (4/9) · 24×2.6</text><text x="211.832" y="136.9" font-size="2.4">사다리 발판 덧댐(앞면에 접착)</text><text x="253.592" y="133.9" font-size="2.6">LD2 ×9 (5/9) · 24×2.6</text><text x="253.592" y="136.9" font-size="2.4">사다리 발판 덧댐(앞면에 접착)</text><text x="295.352" y="133.9" font-size="2.6">LD2 ×9 (6/9) · 24×2.6</text><text x="295.352" y="136.9" font-size="2.4">사다리 발판 덧댐(앞면에 접착)</text><text x="337.112" y="133.9" font-size="2.6">LD2 ×9 (7/9) · 24×2.6</text><text x="337.112" y="136.9" font-size="2.4">사다리 발판 덧댐(앞면에 접착)</text><text x="378.872" y="133.9" font-size="2.6">LD2 ×9 (8/9) · 24×2.6</text><text x="378.872" y="136.9" font-size="2.4">사다리 발판 덧댐(앞면에 접착)</text><text x="420.632" y="133.9" font-size="2.6">LD2 ×9 (9/9) · 24×2.6</text><text x="420.632" y="136.9" font-size="2.4">사다리 발판 덧댐(앞면에 접착)</text><text x="6" y="153.2">사다리 조립: LD1 앞면에 LD2 9개를 접착(발판 깊이 2+2=4) → LD1·LD3 윗탭을 LD4 양끝 슬롯에 함께 끼움 → 아래 탭을 바닥 슬롯에 끼움(사다리 전체를 18.3° 돌려 설치).</text><text x="6" y="157.8">LD4의 기울어진 슬롯에 아이 실루엣(CH) 발 탭을 꽂음. 신발은 4장(=한 켤레)을 2장씩 접착해 바구니 오른쪽 앞 바닥에 놓음.</text></g>
