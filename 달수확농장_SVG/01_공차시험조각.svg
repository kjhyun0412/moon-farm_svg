<g id="LABEL_참고용" inkscape:groupmode="layer" inkscape:label="LABEL_참고용(가공 제외)" fill="#888888" stroke="none" font-family="sans-serif" font-size="3"><text x="6" y="8.4">A. 홈 게이지 · 재료 2mm 기준 · 같은 합판 자투리를 끼워 가장 알맞은 칸 찾기 (홈 폭 = 2 + 표시값)</text><text x="6" y="44.4">A. 홈 게이지 · 재료 3mm 기준 · 같은 합판 자투리를 끼워 가장 알맞은 칸 찾기 (홈 폭 = 3 + 표시값)</text><text x="6" y="80.4">A. 홈 게이지 · 재료 4mm 기준 · 같은 합판 자투리를 끼워 가장 알맞은 칸 찾기 (홈 폭 = 4 + 표시값)</text><text x="6" y="116.4">B. 핑거 결합 시험 (3mm 합판) · 한 쌍 = 핑거 판 P + 홈 판 Q, 직각으로 끼워 보기 (홈 깊이 3+c, 홈 폭 10+c)</text><text x="6" y="204.4">C. 커프: 실제 치수 측정</text><text x="84" y="204.4">D. 핀 구멍 폭 (실루엣 핀 1.6 × 두께 2)</text><text x="160" y="204.4">E. 가는 부품 폭 (울타리 기둥·사다리 다리) 부러지는지 확인</text><text x="6" y="250.4">F. 면 각인 시험 · 같은 면적을 출력/속도를 바꿔 3번 새겨서 금색 도장이 잘 앉는 농도 찾기 (남색 염색 합판 위)</text><text x="126" y="23">← A 끼움판 ×2 · 2mm 합판으로 자르기 (12mm 쪽 모서리를 홈에 세워 끼움)</text><text x="126" y="59">← A 끼움판 ×2 · 3mm 합판으로 자르기 (12mm 쪽 모서리를 홈에 세워 끼움)</text><text x="126" y="95">← A 끼움판 ×2 · 4mm 합판으로 자르기 (12mm 쪽 모서리를 홈에 세워 끼움)</text><text x="84" y="229.4">D 끼움핀 ×4 · 2mm 합판</text></g>
</svg>
