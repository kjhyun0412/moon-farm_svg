<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="323.561mm" height="105mm" viewBox="0 0 323.561 105">
<title>합판 3mm 달 조명상자 (M1, M2×4, 지지대 B×2)</title>
<desc>단위 mm, 1:1. 달 = 합판 5겹(15mm) + 앞면 유백 아크릴 3mm(=3D 몸통 15 + 앞판 3). 3D에서 달 전체를 z축 둘레로 0.26rad(14.9°) 기울여 설치.</desc>
<g id="CUT_절단" inkscape:groupmode="layer" inkscape:label="CUT_절단(빨강)" fill="none" stroke="#ff0000" stroke-width="0.1" stroke-linejoin="round"><g id="B_1" transform="translate(6 14)"><path d="M1 0 L7 0 L7 3 L8 3 L8 62.2 L7 62.2 L7 65.2 L1 65.2 L1 62.2 L0 62.2 L0 3 L1 3Z"/></g><g id="B_2" transform="translate(43.928 14)"><path d="M1 0 L7 0 L7 3 L8 3 L8 62.2 L7 62.2 L7 65.2 L1 65.2 L1 62.2 L0 62.2 L0 3 L1 3Z"/></g><g id="M1" transform="translate(81.856 14)"><path d="M42.341 4.604 A27.2 27.2 0 1 0 42.341 49.796 A22.75 22.75 0 1 1 42.341 4.604 Z"/><path d="M6.609 14.881 L12.601 16.475 L11.791 19.519 L5.799 17.925Z"/><path d="M6.609 34.881 L12.601 36.475 L11.791 39.519 L5.799 37.925Z"/><path d="M10.7 27.2 A2.5 2.5 0 1 0 15.7 27.2 A2.5 2.5 0 1 0 10.7 27.2 Z"/></g><g id="M2_1" transform="translate(130.197 14)"><path d="M42.341 4.604 A27.2 27.2 0 1 0 42.341 49.796 A22.75 22.75 0 1 1 42.341 4.604 Z"/><path d="M30.353 3.206 A24.2 24.2 0 1 0 30.353 51.194 A25.75 25.75 0 0 1 30.353 3.206 Z"/></g><g id="M2_2" transform="translate(178.538 14)"><path d="M42.341 4.604 A27.2 27.2 0 1 0 42.341 49.796 A22.75 22.75 0 1 1 42.341 4.604 Z"/><path d="M30.353 3.206 A24.2 24.2 0 1 0 30.353 51.194 A25.75 25.75 0 0 1 30.353 3.206 Z"/></g><g id="M2_3" transform="translate(226.879 14)"><path d="M42.341 4.604 A27.2 27.2 0 1 0 42.341 49.796 A22.75 22.75 0 1 1 42.341 4.604 Z"/><path d="M30.353 3.206 A24.2 24.2 0 1 0 30.353 51.194 A25.75 25.75 0 0 1 30.353 3.206 Z"/></g><g id="M2_4" transform="translate(275.22 14)"><path d="M42.341 4.604 A27.2 27.2 0 1 0 42.341 49.796 A22.75 22.75 0 1 1 42.341 4.604 Z"/><path d="M30.353 3.206 A24.2 24.2 0 1 0 30.353 51.194 A25.75 25.75 0 0 1 30.353 3.206 Z"/></g></g>
<g id="SCORE_선각인" inkscape:groupmode="layer" inkscape:label="SCORE_선각인(파랑)" fill="none" stroke="#0000ff" stroke-width="0.1"></g>
<g id="ENGRAVE_면각인" inkscape:groupmode="layer" inkscape:label="ENGRAVE_면각인(검정)" fill="#000000" stroke="none"></g>
<g id="LABEL_참고용" inkscape:groupmode="layer" inkscape:label="LABEL_참고용(가공 제외)" fill="#888888" stroke="none" font-family="sans-serif" font-size="3"><text x="6" y="9.4" font-size="2.6">B ×2 (1/2) · 8×65.2</text><text x="6" y="12.4" font-size="2.4">달 지지대</text><text x="43.928" y="9.4" font-size="2.6">B ×2 (2/2) · 8×65.2</text><text x="43.928" y="12.4" font-size="2.4">달 지지대</text><text x="81.856" y="9.4" font-size="2.6">M1 ×1 · 42.341×54.4</text><text x="81.856" y="12.4" font-size="2.4">달 뒤판(L1)</text><text x="130.197" y="9.4" font-size="2.6">M2 ×4 (1/4) · 42.341×54.4</text><text x="130.197" y="12.4" font-size="2.4">달 링(L2~L5)</text><text x="178.538" y="9.4" font-size="2.6">M2 ×4 (2/4) · 42.341×54.4</text><text x="178.538" y="12.4" font-size="2.4">달 링(L2~L5)</text><text x="226.879" y="9.4" font-size="2.6">M2 ×4 (3/4) · 42.341×54.4</text><text x="226.879" y="12.4" font-size="2.4">달 링(L2~L5)</text><text x="275.22" y="9.4" font-size="2.6">M2 ×4 (4/4) · 42.341×54.4</text><text x="275.22" y="12.4" font-size="2.4">달 링(L2~L5)</text><text x="6" y="89.8">M1(뒤판)의 지지대 구멍 2개는 달 로컬 (-18,±10) 위치이며 달의 기울기 0.26rad을 반대로 돌려 전역 수평으로 맞춤.</text><text x="6" y="94.4">M2 링 4장 = 가운데 빈 공간(안쪽 초승달) → LED/COB 설치 공간. 쌓는 순서: M1 → M2×4 → 앞판(08번 유백 아크릴).</text><text x="6" y="99">달 지지대 B 2개: 한쪽 탭 → M1 구멍, 다른 쪽 탭 → 속판 S7 슬롯(B1, B2). 달 중심 3D 좌표 (-16, 184, -8).</text></g>
</svg>
